<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <title>Night Schedule</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">

  <style>
    :root {
      --navy:    #0a1628;
      --accent:  oklch(52% 0.18 245);
      --accent-light: oklch(96% 0.04 245);
      --accent-mid: oklch(76% 0.10 245);
      --surface: #ffffff;
      --surface-2: #f5f6f8;
      --border:  #e2e5eb;
      --text-primary: #0a1628;
      --text-secondary: #5a6479;
      --text-muted: #9aa0b0;
      --red: oklch(52% 0.18 22);
      --red-light: oklch(96% 0.04 22);
      --amber: oklch(68% 0.14 75);
      --amber-light: oklch(97% 0.04 75);
      --teal: oklch(52% 0.14 195);
      --teal-light: oklch(96% 0.04 195);
      --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(10,22,40,0.06);
      --shadow: 0 4px 12px rgba(10,22,40,0.08);
      --shadow-lg: 0 12px 32px rgba(10,22,40,0.12), 0 4px 8px rgba(10,22,40,0.06);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--surface-2);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .offline-banner { display: none; background: var(--amber); color: #fff; text-align: center; padding: 8px 20px; font-size: 0.8rem; font-weight: 500; }
    .offline-banner.show { display: block; }

    header { background: var(--navy); position: sticky; top: 0; z-index: 100; }

    .header-inner {
      max-width: 1160px; margin: 0 auto; padding: 0 24px;
      height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }

    .wordmark { display: flex; align-items: baseline; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .wordmark-org { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-mid); }
    .wordmark-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.15); align-self: center; }
    .wordmark-name { font-size: 0.95rem; font-weight: 500; color: #fff; letter-spacing: 0.01em; }

    .header-right { display: flex; align-items: center; gap: 8px; }

    .user-chip { display: none; align-items: center; gap: 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 5px 12px 5px 8px; }
    .user-chip.show { display: flex; }
    .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 600; color: #fff; flex-shrink: 0; }
    .user-name-text { font-size: 0.82rem; color: rgba(255,255,255,0.9); font-weight: 400; white-space: nowrap; }

    .header-btn { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.12); padding: 6px 14px; border-radius: var(--radius-sm); font-family: inherit; font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: background 0.15s, color 0.15s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .header-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .header-btn.accent { background: var(--accent); border-color: transparent; color: #fff; }
    .install-btn { display: none; }
    .install-btn.show { display: inline-flex; }

    main { max-width: 1160px; margin: 0 auto; padding: 40px 24px 60px; }

    .page-header { margin-bottom: 36px; }
    .page-header-eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .page-header h2 { font-size: 1.6rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1.2; }
    .page-header p { margin-top: 8px; color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; font-weight: 300; }

    .section-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; text-decoration: none; color: inherit; display: block; transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s; position: relative; overflow: hidden; cursor: pointer; animation: cardIn 0.4s ease both; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-accent, var(--accent)); opacity: 0; transition: opacity 0.2s; }
    .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: transparent; }
    .card:hover::before { opacity: 1; }
    .card.disabled { opacity: 0.5; cursor: not-allowed; }
    .card.disabled:hover { transform: none; box-shadow: none; border-color: var(--border); }
    .card.disabled:hover::before { opacity: 0; }

    .card-icon-wrap { width: 44px; height: 44px; border-radius: var(--radius); background: var(--card-icon-bg, var(--accent-light)); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .card-icon-wrap svg { width: 22px; height: 22px; stroke: var(--card-icon-color, var(--accent)); stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .card h3 { font-size: 1rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; line-height: 1.3; }
    .card-badge { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--accent-light); color: var(--accent); white-space: nowrap; flex-shrink: 0; }
    .card-badge.soon { background: var(--surface-2); color: var(--text-muted); }
    .card-badge.admin-badge { background: var(--red-light); color: var(--red); }
    .card p { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.55; font-weight: 300; }
    .card-arrow { position: absolute; bottom: 20px; right: 20px; opacity: 0; transform: translateX(-4px); transition: opacity 0.2s, transform 0.2s; }
    .card-arrow svg { width: 16px; height: 16px; stroke: var(--text-muted); stroke-width: 2; fill: none; stroke-linecap: round; }
    .card:not(.disabled):hover .card-arrow { opacity: 1; transform: translateX(0); }

    .card[data-variant="scheduling"]  { --card-accent: var(--accent); --card-icon-bg: var(--accent-light); --card-icon-color: var(--accent); }
    .card[data-variant="admin"]       { --card-accent: var(--red); --card-icon-bg: var(--red-light); --card-icon-color: var(--red); }

    .cards-grid .card:nth-child(1) { animation-delay: 0.05s; }
    .cards-grid .card:nth-child(2) { animation-delay: 0.10s; }
    .cards-grid .card:nth-child(3) { animation-delay: 0.15s; }

    @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    footer { text-align: center; padding: 24px 20px 40px; color: var(--text-muted); font-size: 0.78rem; letter-spacing: 0.01em; }
    footer span { display: inline-flex; align-items: center; gap: 6px; }
    footer .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }

    @media (max-width: 600px) {
      .header-inner { padding: 0 16px; height: 54px; }
      main { padding: 28px 16px 48px; }
      .page-header h2 { font-size: 1.3rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .user-name-text { display: none; }
    }
  </style>
</head>
<body>

  <div class="offline-banner" id="offlineBanner">You're offline — some features may be unavailable</div>

  <header>
    <div class="header-inner">
      <a class="wordmark" href="/">
        <span class="wordmark-org" id="wordmarkOrg">Night Schedule</span>
        <span class="wordmark-divider" id="wordmarkDivider" style="display:none;"></span>
        <span class="wordmark-name" id="wordmarkName"></span>
      </a>
      <div class="header-right">
        <div class="user-chip" id="userChip">
          <div class="user-avatar" id="userAvatar">–</div>
          <span class="user-name-text" id="userName"></span>
        </div>
        <a href="/login.html" class="header-btn accent" id="loginButton" style="display:none;">Sign in</a>
        <button class="header-btn" id="logoutButton" style="display:none;">Sign out</button>
        <button class="header-btn install-btn" id="installButton">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5M5 19h14"/></svg>
          Install
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div class="page-header-eyebrow">Dashboard</div>
      <h2 id="welcomeTitle">Welcome</h2>
      <p id="welcomeSubtitle">Select a tool below to get started.</p>
    </div>

    <div class="section-label">Tools</div>

    <div class="cards-grid" id="cardsGrid">
      <!-- Cards injected by JS -->
    </div>
  </main>

  <footer>
    <span>
      <span id="footerName">Night Schedule</span>
      <span class="dot"></span>
      Built with FacultyHubAdaptable
    </span>
  </footer>

  <script>
    const API = window.location.origin;

    function greeting() {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 17) return 'Good afternoon';
      return 'Good evening';
    }

    function getInitials(name) {
      return (name || '?').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    }

    // ── Apply public config to page chrome ─────────────────────────────────
    function applyConfig(cfg) {
      const org   = cfg.branding && cfg.branding.org_label ? cfg.branding.org_label : '';
      const appNm = cfg.app_name || 'Night Schedule';

      document.title = org ? (org + ' — ' + appNm) : appNm;
      document.getElementById('footerName').textContent = appNm;

      if (org) {
        document.getElementById('wordmarkOrg').textContent  = org;
        document.getElementById('wordmarkDivider').style.display = '';
        document.getElementById('wordmarkName').textContent = appNm;
      } else {
        document.getElementById('wordmarkOrg').textContent  = appNm;
        document.getElementById('wordmarkDivider').style.display = 'none';
        document.getElementById('wordmarkName').textContent = '';
      }

      if (cfg.branding && cfg.branding.accent_color) {
        document.documentElement.style.setProperty('--accent', cfg.branding.accent_color);
      }
    }

    // ── Build cards ──────────────────────────────────────────────────────────
    function buildCards(isAdmin) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      const ARROW = '<div class="card-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>';

      const scheduleCard = document.createElement('a');
      scheduleCard.href = 'schedule.html';
      scheduleCard.className = 'card';
      scheduleCard.dataset.variant = 'scheduling';
      scheduleCard.style.animationDelay = '0.05s';
      scheduleCard.innerHTML =
        '<div class="card-icon-wrap"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>' +
        '<div class="card-title-row"><h3>Night Schedule</h3><span class="card-badge">Self-Schedule</span></div>' +
        '<p>View this quarter’s night calendar, see which nights you can work, and mark your preferred and can-work nights.</p>' + ARROW;
      grid.appendChild(scheduleCard);

      if (isAdmin) {
        const adminCard = document.createElement('a');
        adminCard.href = 'admin/index.html';
        adminCard.className = 'card';
        adminCard.dataset.variant = 'admin';
        adminCard.style.animationDelay = '0.10s';
        adminCard.innerHTML =
          '<div class="card-icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>' +
          '<div class="card-title-row"><h3>Admin Dashboard</h3><span class="card-badge admin-badge">Admin</span></div>' +
          '<p>Manage providers, set up quarters, run the night-schedule builder, and configure this instance.</p>' + ARROW;
        grid.appendChild(adminCard);
      }
    }

    // ── Auth check ─────────────────────────────────────────────────────────
    async function init() {
      let cfg = {};
      try {
        const res = await fetch(API + '/api/config/public');
        if (res.ok) cfg = await res.json();
      } catch (e) {}

      applyConfig(cfg);

      try {
        const res = await fetch(API + '/api/auth/check', { credentials: 'include' });
        const data = await res.json();

        if (data.authenticated) {
          const name = data.faculty_name || '';
          document.getElementById('welcomeTitle').textContent = greeting() + ', ' + name.split(' ')[0];
          document.getElementById('welcomeSubtitle').textContent = 'View your night schedule and update your preferences below.';
          document.getElementById('userName').textContent = name;
          document.getElementById('userAvatar').textContent = getInitials(name);
          document.getElementById('userChip').classList.add('show');
          document.getElementById('logoutButton').style.display = 'inline-flex';
          document.getElementById('loginButton').style.display = 'none';

          buildCards(!!data.is_admin);
        } else {
          window.location.href = '/login.html';
        }
      } catch (e) {
        console.warn('Auth check failed:', e);
        window.location.href = '/login.html';
      }
    }

    document.getElementById('logoutButton').addEventListener('click', async () => {
      try { await fetch(API + '/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
      window.location.href = '/login.html';
    });

    init();

    // ── PWA Install ──
    let deferredPrompt;
    const installBtn = document.getElementById('installButton');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.classList.add('show'); });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.remove('show');
    });
    window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));

    // ── Offline ──
    function syncOnline() { document.getElementById('offlineBanner').classList.toggle('show', !navigator.onLine); }
    window.addEventListener('online', syncOnline);
    window.addEventListener('offline', syncOnline);
    syncOnline();
  </script>
</body>
</html>
