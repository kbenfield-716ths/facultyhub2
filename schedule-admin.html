<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Schedule Admin — 2026–2027</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; overflow: hidden; }

.app { display: flex; height: 100vh; flex-direction: column; }

/* ── toolbar ── */
.toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: linear-gradient(135deg, #1e3a5f 0%, #2d5282 100%);
  color: white; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.toolbar h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
.toolbar-spacer { flex: 1; }
.legend { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: rgba(255,255,255,0.9); white-space: nowrap; }
.legend-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

/* ── buttons ── */
.btn {
  padding: 6px 12px; border-radius: 6px; border: none;
  cursor: pointer; font-size: 12px; font-weight: 600;
  white-space: nowrap; transition: all 0.15s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
.btn-primary { background: #3b82f6; color: white; }
.btn-success { background: #10b981; color: white; }
.btn-warning { background: #f59e0b; color: white; }
.btn-ghost { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.25); }

/* ── change banner ── */
.change-banner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 16px;
  background: #fef3c7; border-bottom: 1px solid #fcd34d;
  font-size: 11px; color: #92400e; flex-shrink: 0;
}

/* ── main layout ── */
.main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* ── grid ── */
.grid-container { flex: 1; overflow: auto; position: relative; }

table { border-collapse: collapse; font-size: 11px; }

/* sticky column headers */
thead tr th {
  position: sticky; top: 0; z-index: 10;
  background: #1e3a5f; color: white;
  padding: 5px 3px; text-align: center;
  border-right: 1px solid #2d5282; border-bottom: 2px solid #4a90d9;
  white-space: nowrap;
}
thead tr th .fname { font-size: 10px; font-weight: 700; display: block; }
thead tr th .lname { font-size: 9px; font-weight: 400; opacity: 0.75; display: block; }
thead tr th:first-child {
  position: sticky; left: 0; z-index: 20;
  min-width: 105px; text-align: left; padding-left: 8px;
}

/* sticky row headers */
tbody tr td:first-child {
  position: sticky; left: 0; z-index: 5;
  background: #2d4f7a; color: white;
  padding: 3px 8px;
  border-right: 2px solid #4a90d9; border-bottom: 1px solid #3d6494;
  min-width: 105px; font-weight: 600;
  line-height: 1.3;
}
tbody tr:hover td:first-child { background: #3d6494; }

/* week type left-border accent */
.wt-summer      td:first-child { border-left: 4px solid #f59e0b !important; }
.wt-christmas   td:first-child { border-left: 4px solid #ef4444 !important; }
.wt-thanksgiving td:first-child { border-left: 4px solid #f97316 !important; }
.wt-regular     td:first-child { border-left: 4px solid #6b7280 !important; }
.wt-chest_conference td:first-child,
.wt-sccm_conference  td:first-child,
.wt-ats_conference   td:first-child,
.wt-conference  td:first-child { border-left: 4px solid #8b5cf6 !important; }
.wt-spring_break td:first-child { border-left: 4px solid #10b981 !important; }

/* assignment cells */
.cell {
  padding: 2px 3px; text-align: center;
  border: 1px solid #e5e7eb;
  min-width: 76px; height: 26px;
  vertical-align: middle; font-weight: 600; font-size: 10px;
  transition: transform 0.1s, box-shadow 0.1s;
  position: relative;
}
.cell-inner {
  display: flex; align-items: center; justify-content: center;
  height: 100%; border-radius: 3px; padding: 1px 4px;
}
.cell.draggable { cursor: grab; }
.cell.draggable:hover .cell-inner {
  filter: brightness(0.93);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
}
.cell.draggable:active { cursor: grabbing; }
.cell.drag-source .cell-inner { opacity: 0.35; }
.cell.drag-over .cell-inner {
  outline: 2.5px solid #2563eb;
  outline-offset: 0;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
}
.cell.locked { cursor: not-allowed; }
.cell.conflict .cell-inner { outline: 2px solid #ef4444; outline-offset: 0; }
.cell.conflict::after {
  content: '⚠'; position: absolute; top: 0; right: 1px;
  font-size: 8px; color: #ef4444; line-height: 1;
}

/* ── sidebar ── */
.sidebar {
  width: 268px; background: white;
  border-left: 1px solid #e5e7eb; overflow-y: auto; flex-shrink: 0;
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 10px 14px; background: #1e3a5f; color: white;
  font-weight: 700; font-size: 13px;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; flex-shrink: 0;
}
.sidebar-subhead {
  padding: 6px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
  display: flex; font-size: 10px; color: #64748b; font-weight: 600;
  position: sticky; top: 36px; flex-shrink: 0; z-index: 2;
}
.faculty-row {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 6px 12px; border-bottom: 1px solid #f1f5f9;
}
.faculty-row:hover { background: #f8fafc; }
.faculty-name {
  font-size: 11px; font-weight: 600; flex: 0 0 105px; color: #1e293b;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding-top: 2px;
}
.assign-chips { display: flex; gap: 3px; flex-wrap: wrap; }
.chip {
  font-size: 9px; padding: 2px 5px; border-radius: 10px; font-weight: 700;
  white-space: nowrap;
}
.chip-total {
  font-size: 9px; padding: 2px 5px; border-radius: 10px;
  background: #f1f5f9; color: #64748b; font-weight: 600;
  border: 1px solid #e2e8f0;
}

/* conflict highlights in sidebar */
.faculty-row.has-conflict .faculty-name { color: #ef4444; }

/* ── tooltip ── */
.drag-hint {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.75); color: white; padding: 6px 14px;
  border-radius: 20px; font-size: 11px; pointer-events: none;
  z-index: 9999; white-space: nowrap;
}
</style>
</head>

function buildWeeks(raw) {
  return raw.map(r => ({
    weekNum:   r[0],
    startDate: r[1],
    endDate:   r[2],
    weekType:  r[3],
    assignments: r.slice(4).map(v => (v || 'Open')),
  }));
}

/* ─────────────────── helpers ─────────────────── */
function computeBalance(weeks) {
  return FACULTY.map((_, fi) => {
    const counts = Object.fromEntries(ASSIGN_TYPES.map(t => [t, 0]));
    weeks.forEach(w => { if (ASSIGN_TYPES.includes(w.assignments[fi])) counts[w.assignments[fi]]++; });
    return counts;
  });
}

function detectConflicts(weeks) {
  const out = new Set();
  weeks.forEach((w, wi) => {
    const byType = {};
    w.assignments.forEach((a, fi) => {
      if (COVERAGE.has(a)) { (byType[a] = byType[a] || []).push(fi); }
    });
    Object.values(byType).forEach(fis => {
      if (fis.length > 1) fis.forEach(fi => out.add(`${wi}-${fi}`));
    });
  });
  return out;
}

function splitName(name) {
  const parts = name.split(' ');
  if (parts.length === 1) return { first: name, last: '' };
  return { first: parts[0], last: parts.slice(1).join(' ') };
}

/* ─────────────────── main component ─────────────────── */
function App() {
  const [weeks, setWeeks]         = useState(() => buildWeeks(RAW_WEEKS));
  const [dragSrc, setDragSrc]     = useState(null);   // {wi, fi, val}
  const [dragOver, setDragOver]   = useState(null);   // {wi, fi}
  const [history, setHistory]     = useState([]);
  const [showSidebar, setShowSidebar] = useState(true);
  const [hasChanges, setHasChanges]   = useState(false);

  const balance   = useMemo(() => computeBalance(weeks), [weeks]);
  const conflicts = useMemo(() => detectConflicts(weeks), [weeks]);

  /* drag handlers */
  const onDragStart = useCallback((e, wi, fi) => {
    const val = weeks[wi].assignments[fi];
    if (LOCKED.has(val)) { e.preventDefault(); return; }
    setDragSrc({ wi, fi, val });
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', val);
  }, [weeks]);

  const onDragOver = useCallback((e, wi, fi) => {
    if (!dragSrc) return;
    const target = weeks[wi].assignments[fi];
    if (LOCKED.has(target)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    setDragOver({ wi, fi });
  }, [weeks, dragSrc]);

  const onDragLeave = useCallback(() => setDragOver(null), []);

  const onDrop = useCallback((e, wi, fi) => {
    e.preventDefault();
    setDragOver(null);
    if (!dragSrc) return;
    const target = weeks[wi].assignments[fi];
    if (LOCKED.has(target)) { setDragSrc(null); return; }
    if (dragSrc.wi === wi && dragSrc.fi === fi) { setDragSrc(null); return; }

    // snapshot for undo
    setHistory(h => [
      ...h.slice(-29),
      weeks.map(w => ({ ...w, assignments: [...w.assignments] }))
    ]);

    setWeeks(prev => {
      const next = prev.map(w => ({ ...w, assignments: [...w.assignments] }));
      next[wi].assignments[fi] = dragSrc.val;        // target gets the assignment
      next[dragSrc.wi].assignments[dragSrc.fi] = 'Open'; // source becomes Open
      return next;
    });
    setDragSrc(null);
    setHasChanges(true);
  }, [dragSrc, weeks]);

  const onDragEnd = useCallback(() => {
    setDragSrc(null);
    setDragOver(null);
  }, []);

  /* undo */
  const undo = useCallback(() => {
    if (!history.length) return;
    setWeeks(history[history.length - 1]);
    setHistory(h => h.slice(0, -1));
    if (history.length <= 1) setHasChanges(false);
  }, [history]);

  /* export */
  const exportCSV = useCallback(() => {
    const header = ['Week #','Start Date','End Date','Week Type',...FACULTY];
    const rows   = weeks.map(w => [w.weekNum, w.startDate, w.endDate, w.weekType, ...w.assignments]);
    const csv    = [header, ...rows].map(r => r.join(',')).join('\n');
    const url    = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'faculty-schedule-modified.csv'; a.click();
    URL.revokeObjectURL(url);
    setHasChanges(false);
  }, [weeks]);

  /* reset */
  const reset = useCallback(() => {
    if (!window.confirm('Reset all changes back to the original schedule?')) return;
    setWeeks(buildWeeks(RAW_WEEKS));
    setHistory([]);
    setHasChanges(false);
  }, []);

  /* cell style */
  const cellStyle = (val) => {
    const c = COLORS[val] || COLORS['Open'];
    return { background: c.bg, borderColor: c.border };
  };
  const innerStyle = (val) => {
    const c = COLORS[val] || COLORS['Open'];
    return { color: c.text };
  };

  /* conflict lookup per faculty for sidebar */
  const facultyConflictWeeks = useMemo(() => {
    const m = FACULTY.map(() => 0);
    conflicts.forEach(key => {
      const [, fi] = key.split('-').map(Number);
      m[fi]++;
    });
    return m;
  }, [conflicts]);

  return (
    <div className="app">

      {/* ── toolbar ── */}
      <div className="toolbar">
        <h1>📅 Faculty Schedule Admin — 2026–2027</h1>

        <div className="legend">
          {ASSIGN_TYPES.map(t => (
            <div key={t} className="legend-item">
              <div className="legend-dot" style={{background: COLORS[t].bg, border:`1px solid ${COLORS[t].border}`}}/>
              {t}
            </div>
          ))}
          <div className="legend-item">
            <div className="legend-dot" style={{background:'#374151',border:'1px solid #4b5563'}}/>
            Blocked/Unavail.
          </div>
        </div>

        <div className="toolbar-spacer"/>

        <button className="btn btn-ghost" onClick={() => setShowSidebar(s => !s)}>
          {showSidebar ? '⟩ Hide' : '⟨ Balance'}
        </button>
        <button className="btn btn-ghost" onClick={undo} disabled={!history.length}>
          ↩ Undo ({history.length})
        </button>
        <button className="btn btn-warning" onClick={reset} disabled={!hasChanges}>
          ↺ Reset
        </button>
        <button className="btn btn-success" onClick={exportCSV}>
          ↓ Export CSV
        </button>
      </div>

      {/* ── change banner ── */}
      {hasChanges && (
        <div className="change-banner">
          <span>⚠ Unsaved changes — {history.length} move{history.length !== 1 ? 's' : ''} made</span>
          <span>Export CSV to save · <b>⚠ red outline</b> = coverage conflict in week</span>
        </div>
      )}

      <div className="main">

        {/* ── schedule grid ── */}
        <div className="grid-container">
          <table>
            <thead>
              <tr>
                <th><span className="fname">Week</span><span className="lname">Dates</span></th>
                {FACULTY.map(name => {
                  const { first, last } = splitName(name);
                  return (
                    <th key={name}>
                      <span className="fname">{first}</span>
                      <span className="lname">{last}</span>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {weeks.map((w, wi) => (
                <tr key={wi} className={`wt-${w.weekType}`}>
                  <td>
                    <span style={{fontSize:'11px'}}>Wk {w.weekNum}</span><br/>
                    <span style={{fontSize:'9px',fontWeight:400,opacity:0.8}}>{w.startDate}</span><br/>
                    <span style={{fontSize:'8px',fontWeight:400,opacity:0.6,textTransform:'capitalize'}}>{w.weekType.replace('_',' ')}</span>
                  </td>
                  {w.assignments.map((val, fi) => {
                    const locked    = LOCKED.has(val);
                    const isSrc     = dragSrc?.wi === wi && dragSrc?.fi === fi;
                    const isOver    = dragOver?.wi === wi && dragOver?.fi === fi;
                    const isConflict = conflicts.has(`${wi}-${fi}`);
                    return (
                      <td
                        key={fi}
                        className={[
                          'cell',
                          locked ? 'locked' : 'draggable',
                          isSrc  ? 'drag-source' : '',
                          isOver && !locked ? 'drag-over' : '',
                          isConflict ? 'conflict' : '',
                        ].filter(Boolean).join(' ')}
                        style={cellStyle(val)}
                        draggable={!locked}
                        onDragStart={e => onDragStart(e, wi, fi)}
                        onDragOver={e  => onDragOver(e, wi, fi)}
                        onDragLeave={onDragLeave}
                        onDrop={e      => onDrop(e, wi, fi)}
                        onDragEnd={onDragEnd}
                        title={`${FACULTY[fi]}  ·  Wk ${w.weekNum} (${w.startDate}–${w.endDate})  ·  ${val}${locked ? '  🔒 locked' : '  ↕ drag to move'}`}
                      >
                        <div className="cell-inner" style={innerStyle(val)}>
                          {val === 'Open' ? '' : val === 'Unavailable' ? '—' : val === 'Blocked' ? '■' : val}
                        </div>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* ── balance sidebar ── */}
        {showSidebar && (
          <div className="sidebar">
            <div className="sidebar-header">
              Assignment Balance
              <span style={{fontSize:'10px',fontWeight:400,opacity:0.7}}>{weeks.length} wks</span>
            </div>
            <div className="sidebar-subhead">
              <span style={{flex:'0 0 105px'}}>Faculty</span>
              <span>MICU · APP · Con · Proc · Bkp</span>
            </div>
            {FACULTY.map((name, fi) => {
              const b = balance[fi];
              const hasConf = facultyConflictWeeks[fi] > 0;
              const total = ASSIGN_TYPES.reduce((s, t) => s + b[t], 0);
              return (
                <div key={fi} className={`faculty-row${hasConf ? ' has-conflict' : ''}`}>
                  <div className="faculty-name" title={name}>{name}</div>
                  <div className="assign-chips">
                    {ASSIGN_TYPES.map(t => (
                      <div key={t} className="chip" style={{
                        background: COLORS[t].bg,
                        color: COLORS[t].text,
                        border: `1px solid ${COLORS[t].border}`,
                      }}>
                        {b[t]}
                      </div>
                    ))}
                    <div className="chip-total" title="Total assigned weeks">{total}</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ── drag hint tooltip ── */}
      {dragSrc && (
        <div className="drag-hint">
          Moving <strong>{dragSrc.val}</strong> from {FACULTY[dragSrc.fi]} · Drop on any unlocked cell · Esc to cancel
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
