<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/admin/modules/common/styles.css?v=2">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top header ── */
    .admin-header {
      background: #1e293b;
      color: white;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 100;
    }

    .admin-wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-wordmark-org {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .admin-wordmark-sep {
      color: #334155;
    }

    .admin-wordmark-name {
      font-size: 15px;
      font-weight: 600;
      color: white;
    }

    .header-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .user-info { font-size: 13px; color: #94a3b8; }

    .header-btn {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.2); }

    /* ── Setup banner ── */
    #setupBanner {
      display: none;
      background: #f59e0b;
      color: #1c1917;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    #setupBanner:hover { background: #d97706; color: white; }
    #setupBanner.show { display: block; }

    /* ── Body ── */
    .admin-body { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .admin-sidebar {
      width: 220px;
      background: white;
      border-right: 1px solid #e5e7eb;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 16px 0 24px;
    }

    .nav-section { margin-bottom: 4px; }
    .nav-section-label { padding: 8px 16px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9ca3af; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px; cursor: pointer; font-size: 14px; font-weight: 500;
      color: #374151; border: none; background: none; width: 100%; text-align: left;
      border-left: 3px solid transparent; transition: background 0.12s, color 0.12s; line-height: 1.4;
    }
    .nav-item:hover { background: #f9fafb; color: #111827; }
    .nav-item.active { background: #eff6ff; color: #2563eb; border-left-color: #2563eb; }
    .nav-item .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

    .nav-divider { height: 1px; background: #f3f4f6; margin: 8px 0; }

    /* ── Content ── */
    .admin-content { flex: 1; overflow-y: auto; background: #f3f4f6; }
    .module-view { display: none; }
    .module-view.active { display: block; }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.85); display: none; align-items: center;
      justify-content: center; z-index: 9999; backdrop-filter: blur(2px);
    }
    .loading-spinner { display: flex; flex-direction: column; align-items: center; gap: 12px; color: #6b7280; font-size: 14px; }
    .spinner-ring { width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .admin-sidebar { width: 48px; overflow: visible; }
      .nav-item span:not(.icon) { display: none; }
      .nav-section-label, .nav-divider { display: none; }
      .nav-item { padding: 10px; justify-content: center; }
    }
  </style>
</head>
<body>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner">
      <div class="spinner-ring"></div>
      <span>Loading...</span>
    </div>
  </div>

  <!-- Setup banner (shown when setup_complete = false) -->
  <div id="setupBanner" onclick="showModule('instance-setup')">
    <span data-icon="settings"></span> This instance hasn't been configured yet. Click here to run the setup wizard →
  </div>

  <!-- Top Header -->
  <header class="admin-header">
    <div class="admin-wordmark">
      <span class="admin-wordmark-org" id="headerOrg"></span>
      <span class="admin-wordmark-sep" id="headerSep" style="display:none;">·</span>
      <span class="admin-wordmark-name" id="headerName">Admin Panel</span>
    </div>
    <div class="header-right">
      <select id="divisionPicker" onchange="onDivisionChange()" title="Working division"
              style="display:none;background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2);padding:6px 10px;border-radius:6px;font-size:13px;max-width:180px;"></select>
      <span class="user-info" id="userInfo">Loading...</span>
      <a href="/" class="header-btn">← App</a>
    </div>
  </header>

  <!-- Sidebar + content -->
  <div class="admin-body">

    <nav class="admin-sidebar">

      <div class="nav-section">
        <div class="nav-section-label">People</div>
        <button class="nav-item active" onclick="showModule('faculty-management')" data-module="faculty-management">
          <span class="icon"><span data-icon="users"></span></span><span>Providers</span>
        </button>
        <button class="nav-item" onclick="showModule('user-management')" data-module="user-management">
          <span class="icon"><span data-icon="user"></span></span><span>Users</span>
        </button>
        <button class="nav-item" onclick="showModule('divisions')" data-module="divisions">
          <span class="icon"><span data-icon="grid"></span></span><span>Divisions</span>
        </button>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-section">
        <div class="nav-section-label">Scheduling</div>
        <button class="nav-item" onclick="showModule('schedule-management')" data-module="schedule-management">
          <span class="icon"><span data-icon="calendar"></span></span><span>Schedule</span>
        </button>
        <button class="nav-item" onclick="showModule('shift-schedule')" data-module="shift-schedule">
          <span class="icon"><span data-icon="clock"></span></span><span>Shift Schedule</span>
        </button>
        <button class="nav-item" onclick="showModule('schedule-summary')" data-module="schedule-summary">
          <span class="icon"><span data-icon="bar-chart"></span></span><span>Reports</span>
        </button>
        <button class="nav-item" onclick="showModule('wave-draft')" data-module="wave-draft">
          <span class="icon"><span data-icon="waves"></span></span><span>Wave Draft</span>
        </button>
        <button class="nav-item" onclick="showModule('service-overrides')" data-module="service-overrides">
          <span class="icon"><span data-icon="wrench"></span></span><span>Overrides</span>
        </button>
        <button class="nav-item" onclick="showModule('grid-rebalancer')" data-module="grid-rebalancer">
          <span class="icon"><span data-icon="shuffle"></span></span><span>Grid Rebalancer</span>
        </button>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-section">
        <div class="nav-section-label">Moonlighting</div>
        <button class="nav-item" onclick="showModule('moonlighting')" data-module="moonlighting">
          <span class="icon"><span data-icon="moon"></span></span><span>Signups &amp; Optimizer</span>
        </button>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-section">
        <div class="nav-section-label">Data &amp; Tools</div>
        <button class="nav-item" onclick="showModule('data-management')" data-module="data-management">
          <span class="icon"><span data-icon="download"></span></span><span>Data Management</span>
        </button>
        <button class="nav-item" onclick="showModule('database-viewer')" data-module="database-viewer">
          <span class="icon"><span data-icon="database"></span></span><span>Database Console</span>
        </button>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-section">
        <div class="nav-section-label">Content</div>
        <button class="nav-item" onclick="showModule('knowledge-base')" data-module="knowledge-base">
          <span class="icon"><span data-icon="book-open"></span></span><span>Policies</span>
        </button>
      </div>

      <div class="nav-divider"></div>

      <div class="nav-section">
        <div class="nav-section-label">Instance</div>
        <button class="nav-item" onclick="showModule('instance-setup')" data-module="instance-setup">
          <span class="icon"><span data-icon="settings"></span></span><span>Setup &amp; Config</span>
        </button>
      </div>

    </nav>

    <main class="admin-content">
      <div id="module-faculty-management"  class="module-view active"></div>
      <div id="module-user-management"     class="module-view"></div>
      <div id="module-divisions"           class="module-view"></div>
      <div id="module-schedule-management" class="module-view"></div>
      <div id="module-shift-schedule"      class="module-view"></div>
      <div id="module-schedule-summary"    class="module-view"></div>
      <div id="module-wave-draft"          class="module-view"></div>
      <div id="module-service-overrides"   class="module-view"></div>
      <div id="module-grid-rebalancer"     class="module-view"></div>
      <div id="module-moonlighting"        class="module-view"></div>
      <div id="module-data-management"     class="module-view"></div>
      <div id="module-database-viewer"     class="module-view"></div>
      <div id="module-knowledge-base"      class="module-view"></div>
      <div id="module-instance-setup"      class="module-view"></div>
    </main>

  </div>

  <script src="/admin/modules/common/common.js?v=2"></script>
  <script src="/admin/modules/common/api.js?v=2"></script>

  <script>
    // ── Module registry ──────────────────────────────────────────────────────
    const modules = {
      'faculty-management':  { name: 'Providers',              htmlPath: '/admin/modules/faculty-management/faculty-management.html',  jsPath: '/admin/modules/faculty-management/faculty-management.js' },
      'user-management':     { name: 'Users',                  htmlPath: '/admin/modules/user-management/user-management.html',         jsPath: '/admin/modules/user-management/user-management.js' },
      'divisions':           { name: 'Divisions',              htmlPath: '/admin/modules/divisions/divisions.html',                     jsPath: '/admin/modules/divisions/divisions.js' },
      'schedule-management': { name: 'Schedule',               htmlPath: '/admin/modules/schedule-management/schedule-management.html', jsPath: '/admin/modules/schedule-management/schedule-management.js' },
      'shift-schedule':      { name: 'Shift Schedule',         htmlPath: '/admin/modules/shift-schedule/shift-schedule.html',           jsPath: '/admin/modules/shift-schedule/shift-schedule.js' },
      'schedule-summary':    { name: 'Reports',                htmlPath: '/admin/modules/schedule-summary/schedule-summary.html',       jsPath: '/admin/modules/schedule-summary/schedule-summary.js' },
      'wave-draft':          { name: 'Wave Draft',             htmlPath: '/admin/modules/wave-draft/wave-draft.html',                   jsPath: '/admin/modules/wave-draft/wave-draft.js' },
      'service-overrides':   { name: 'Overrides',              htmlPath: '/admin/modules/service-weeks/overrides/overrides.html',       jsPath: '/admin/modules/service-weeks/overrides/overrides.js' },
      'grid-rebalancer':     { name: 'Grid Rebalancer',        htmlPath: '/admin/modules/grid-rebalancer/grid-rebalancer.html',         jsPath: '/admin/modules/grid-rebalancer/grid-rebalancer.js' },
      'moonlighting':        { name: 'Moonlighting',           htmlPath: '/admin/modules/moonlighting/moonlighting.html',               jsPath: '/admin/modules/moonlighting/moonlighting.js' },
      'data-management':     { name: 'Data Management',        htmlPath: '/admin/modules/data-management/data-management.html',         jsPath: '/admin/modules/data-management/data-management.js' },
      'database-viewer':     { name: 'Database Console',       htmlPath: '/admin/modules/database-viewer/database-viewer.html',         jsPath: '/admin/modules/database-viewer/database-viewer.js' },
      'knowledge-base':      { name: 'Policies',         htmlPath: '/admin/modules/knowledge-base/knowledge-base.html',           jsPath: '/admin/modules/knowledge-base/knowledge-base.js' },
      'instance-setup':      { name: 'Setup & Config',         htmlPath: '/admin/modules/instance-setup/instance-setup.html',           jsPath: '/admin/modules/instance-setup/instance-setup.js' },
    };

    const loadedModules = new Set();
    let currentModule = 'faculty-management';

    // ── Apply config to header ───────────────────────────────────────────────
    function applyConfigToHeader(cfg) {
      const org    = cfg.branding && cfg.branding.org_label ? cfg.branding.org_label : '';
      const name   = cfg.app_name || 'Faculty Hub';
      const headerOrg  = document.getElementById('headerOrg');
      const headerSep  = document.getElementById('headerSep');
      const headerName = document.getElementById('headerName');
      if (org) {
        headerOrg.textContent  = org;
        headerSep.style.display = '';
        headerName.textContent = name + ' — Admin';
      } else {
        headerOrg.textContent  = '';
        headerSep.style.display = 'none';
        headerName.textContent = (name || 'Faculty Hub') + ' — Admin';
      }
      document.title = (org ? org + ' · ' : '') + 'Admin Panel';
    }

    // ── Navigation ───────────────────────────────────────────────────────────
    async function showModule(moduleId) {
      if (!modules[moduleId]) { console.error('Unknown module:', moduleId); return; }
      if (moduleId === currentModule && loadedModules.has(moduleId)) return;

      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const btn = document.querySelector('[data-module="' + moduleId + '"]');
      if (btn) btn.classList.add('active');

      document.querySelectorAll('.module-view').forEach(el => el.classList.remove('active'));
      document.getElementById('loadingOverlay').style.display = 'flex';

      try {
        if (!loadedModules.has(moduleId)) {
          await loadModule(moduleId);
          loadedModules.add(moduleId);
        } else {
          await reloadModuleHTML(moduleId);
        }
        document.getElementById('module-' + moduleId).classList.add('active');
        currentModule = moduleId;
      } catch (err) {
        console.error('Failed to load module:', err);
        document.getElementById('module-' + moduleId).innerHTML =
          '<div style="padding:40px;color:#ef4444;">Failed to load module: ' + err.message + '</div>';
        document.getElementById('module-' + moduleId).classList.add('active');
      } finally {
        document.getElementById('loadingOverlay').style.display = 'none';
      }
    }

    async function loadModule(moduleId) {
      const mod = modules[moduleId];
      const htmlRes = await fetch(mod.htmlPath);
      if (!htmlRes.ok) throw new Error('Could not load HTML for ' + mod.name);
      document.getElementById('module-' + moduleId).innerHTML = await htmlRes.text();
      await loadScript(mod.jsPath);
      requestAnimationFrame(() => setTimeout(() => triggerModuleInit(moduleId), 200));
    }

    async function reloadModuleHTML(moduleId) {
      const mod = modules[moduleId];
      const htmlRes = await fetch(mod.htmlPath);
      if (!htmlRes.ok) throw new Error('Could not reload HTML for ' + mod.name);
      document.getElementById('module-' + moduleId).innerHTML = await htmlRes.text();
      requestAnimationFrame(() => setTimeout(() => triggerModuleInit(moduleId), 200));
    }

    function loadScript(src) {
      if (!src) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src + '?v=' + Date.now();  // bust cache on reload
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load: ' + src));
        document.body.appendChild(s);
      });
    }

    // ── Module init hooks ────────────────────────────────────────────────────
    function triggerModuleInit(moduleId) {
      const inits = {
        'faculty-management':  () => typeof loadFaculty          === 'function' && loadFaculty(),
        'user-management':     () => typeof initUserManagement   === 'function' && initUserManagement(),
        'schedule-management': () => typeof loadHeatmap          === 'function' && loadHeatmap(new Date().getFullYear()),
        'shift-schedule':      () => typeof initShiftSchedule    === 'function' && initShiftSchedule(),
        'divisions':           () => typeof initDivisions        === 'function' && initDivisions(),
        'service-overrides':   () => typeof loadBlocks           === 'function' && loadBlocks(),
        'knowledge-base':      () => typeof loadKBArticles       === 'function' && loadKBArticles(),
        'instance-setup':      () => typeof initInstanceSetup    === 'function' && initInstanceSetup(),
        'wave-draft': () => {
          if (typeof loadConfigs         === 'function') loadConfigs();
          if (typeof loadFacultyForWaves === 'function') loadFacultyForWaves();
        },
        'moonlighting': () => {
          if (typeof loadProviders === 'function') loadProviders();
          if (typeof loadSignups   === 'function') loadSignups();
        },
        'grid-rebalancer':  () => { /* self-initialising IIFE */ },
        'data-management':  () => typeof initDataManagement === 'function' && initDataManagement(),
      };
      try {
        if (inits[moduleId]) inits[moduleId]();
      } catch (err) {
        console.error('Error initialising module ' + moduleId + ':', err);
      }
    }

    // ── Auth ─────────────────────────────────────────────────────────────────
    async function loadUserInfo() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (res.ok) {
          const { faculty } = await res.json();
          document.getElementById('userInfo').textContent =
            faculty.faculty_name + (faculty.is_admin ? ' · Admin' : '');
        } else if (res.status === 401 || res.status === 403) {
          window.location.href = '/?session_expired=1';
        } else {
          document.getElementById('userInfo').textContent = '';
        }
      } catch {
        document.getElementById('userInfo').textContent = '';
      }
    }

    // ── Division picker (admins work on one division at a time) ─────────────
    async function loadDivisionPicker() {
      const sel = document.getElementById('divisionPicker');
      let divisions = [];
      try {
        divisions = await getDivisions();
      } catch { return; }
      if (!divisions.length) return;   // no divisions configured yet — hide picker
      const current = getCurrentDivision();
      sel.innerHTML = '<option value="">All divisions</option>' +
        divisions.map(d =>
          `<option value="${d.key}" ${d.key === current ? 'selected' : ''}>${d.label}${d.member_count != null ? ' (' + d.member_count + ')' : ''}</option>`
        ).join('');
      sel.style.display = '';
    }

    async function onDivisionChange() {
      setCurrentDivision(document.getElementById('divisionPicker').value);
      // Re-render the active module under the new division context
      if (currentModule) {
        const m = currentModule;
        currentModule = null;          // force showModule to re-run
        await showModule(m);
      }
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      await loadUserInfo();
      await loadDivisionPicker();

      // Load and cache instance config
      const cfg = await loadInstanceConfig();
      applyConfigToHeader(cfg);

      // Show setup banner if not configured
      if (!cfg.setup_complete) {
        document.getElementById('setupBanner').classList.add('show');
      }

      // Check URL for ?module= param
      const params = new URLSearchParams(window.location.search);
      const requestedModule = params.get('module');
      const startModule = requestedModule && modules[requestedModule]
        ? requestedModule
        : (!cfg.setup_complete ? 'instance-setup' : 'faculty-management');

      await showModule(startModule);
    });
  </script>
  <script src="/admin/modules/common/icons.js?v=2"></script>
</body>
</html>
