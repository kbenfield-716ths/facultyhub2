<div class="module-container">
  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title"><span data-icon="users"></span> Divisions</h2>
        <p style="margin-top:8px;color:#6b7280;font-size:14px;">
          Manage divisions and set how each one opens scheduling to its people
        </p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn-secondary btn-sm" onclick="loadDivisions()"><span data-icon="refresh"></span> Refresh</button>
        <button class="btn-primary btn-sm" onclick="divShowNewForm()"><span data-icon="plus"></span> New Division</button>
      </div>
    </div>

    <div id="divAlert" class="alert"></div>

    <!-- New division form (hidden by default) -->
    <div id="divNewForm" style="display:none;background:#f9fafb;padding:20px;border-radius:8px;margin-bottom:24px;">
      <h3 style="margin-bottom:16px;font-size:16px;font-weight:600;color:#1f2937;">New Division</h3>
      <div class="form-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
        <div class="form-group">
          <label>Key <span style="color:#ef4444">*</span></label>
          <input type="text" id="divNewKey" placeholder="cardiology">
          <small>Lowercase letters, numbers, underscores. Permanent.</small>
        </div>
        <div class="form-group">
          <label>Label <span style="color:#ef4444">*</span></label>
          <input type="text" id="divNewLabel" placeholder="Cardiology">
        </div>
        <div class="form-group">
          <label>Color</label>
          <input type="color" id="divNewColor" value="#2563eb" style="height:38px;padding:2px;">
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:16px;">
        <button class="btn-primary" onclick="divCreate()">Create Division</button>
        <button class="btn-secondary" onclick="divHideNewForm()">Cancel</button>
      </div>
    </div>

    <!-- Division panels injected here -->
    <div id="divList"></div>
  </div>
</div>
