<div class="module-container">
  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title">🗄️ Database Viewer</h2>
        <p style="margin-top: 8px; color: #6b7280; font-size: 14px;">
          Inspect database tables, schema, and data directly
        </p>
      </div>
      <button class="btn-secondary btn-sm" onclick="loadTables()">🔄 Refresh</button>
    </div>

    <!-- Alert -->
    <div id="dbAlert" class="alert"></div>

    <!-- Tables List -->
    <div style="margin-bottom: 24px;">
      <h3 style="margin-bottom: 16px; color: #1f2937; font-size: 16px; font-weight: 600;">📋 Database Tables</h3>
      <div id="tablesList" style="background: #f9fafb; padding: 20px; border-radius: 8px;">
        <p style="color: #6b7280;">Loading tables...</p>
      </div>
    </div>

    <!-- Duplicate Finder -->
    <div style="margin-bottom: 24px; background: #fef3c7; padding: 16px; border-radius: 8px; border: 2px solid #fbbf24;">
      <h3 style="margin-bottom: 12px; color: #92400e; font-size: 16px; font-weight: 600;">🔍 Find Duplicate Faculty</h3>
      <p style="color: #78350f; margin-bottom: 12px; font-size: 14px;">Check for duplicate faculty members by ID or email</p>
      <button class="btn-sm" style="background: #f59e0b; color: white; border: 1px solid #f59e0b;" onclick="findDuplicates()">
        🔎 Find Duplicates
      </button>
      <div id="duplicatesResult" style="margin-top: 16px;"></div>
    </div>

    <!-- Table Viewer -->
    <div id="tableViewer" style="display: none; margin-top: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="color: #1f2937; font-size: 16px; font-weight: 600;">
          📊 Table: <span id="currentTableName"></span>
        </h3>
        <button class="btn-secondary btn-sm" onclick="closeTableViewer()">✕ Close</button>
      </div>

      <!-- Table Schema -->
      <div style="margin-bottom: 20px;">
        <h4 style="margin-bottom: 12px; color: #374151; font-size: 14px; font-weight: 600;">🏗️ Schema</h4>
        <div id="tableSchema" class="table-container"></div>
      </div>

      <!-- Table Data -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h4 style="color: #374151; font-size: 14px; font-weight: 600;">📄 Data</h4>
          <div style="display: flex; gap: 12px; align-items: center;">
            <span id="dataInfo" style="color: #6b7280; font-size: 14px;"></span>
            <button class="btn-sm btn-secondary" onclick="prevPage()" id="prevBtn" disabled>← Prev</button>
            <button class="btn-sm btn-secondary" onclick="nextPage()" id="nextBtn">Next →</button>
          </div>
        </div>
        <div id="tableData" class="table-container"></div>
      </div>
    </div>

    <!-- Custom Query -->
    <div style="margin-top: 32px; background: #eff6ff; padding: 20px; border-radius: 8px; border: 2px solid #60a5fa;">
      <h3 style="margin-bottom: 12px; color: #1e40af; font-size: 16px; font-weight: 600;">⚡ Custom Query (SELECT only)</h3>
      <div class="form-group">
        <label>SQL Query</label>
        <textarea id="customQuery" rows="4" placeholder="SELECT * FROM faculty WHERE active = 1 LIMIT 10" style="font-family: 'Courier New', monospace;"></textarea>
        <small>Only SELECT queries are allowed for safety</small>
      </div>
      <button class="btn-sm" style="background: #3b82f6; color: white; border: 1px solid #3b82f6;" onclick="executeCustomQuery()">
        ▶️ Execute Query
      </button>
      <div id="queryResult" style="margin-top: 16px;"></div>
    </div>
  </div>
</div>

<style>
.table-row {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
  cursor: pointer;
  transition: background-color 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.table-row:hover {
  background-color: #f3f4f6;
}

.table-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  background: #dbeafe;
  color: #1e40af;
}

.duplicate-box {
  background: white;
  border: 2px solid #ef4444;
  border-radius: 8px;
  padding: 16px;
  margin-top: 12px;
}

.duplicate-record {
  background: #fef2f2;
  padding: 12px;
  border-radius: 6px;
  margin-top: 8px;
  border: 1px solid #fecaca;
}

.no-duplicates {
  background: #f0fdf4;
  padding: 16px;
  border-radius: 8px;
  color: #166534;
  border: 2px solid #86efac;
}
</style>
