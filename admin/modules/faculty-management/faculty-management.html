<div class="module-container">
  <div class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title"><span data-icon="users"></span> Provider Management</h2>
        <p style="margin-top:8px;color:#6b7280;font-size:14px;" id="fmSubtitle">
          Manage providers, roles, and service tracking
        </p>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span id="facultyCount" style="color:#6b7280;font-weight:500;">Loading...</span>
        <button class="btn-secondary btn-sm" onclick="loadFaculty()"><span data-icon="refresh"></span> Refresh</button>
        <button class="btn-primary btn-sm" onclick="toggleAddForm()"><span data-icon="plus"></span> Add Provider</button>
      </div>
    </div>

    <div id="facultyAlert" class="alert"></div>

    <!-- Add Faculty Form (collapsed by default) -->
    <div id="addFacultyForm" style="display:none;background:#f9fafb;padding:20px;border-radius:8px;margin-bottom:24px;">
      <h3 style="margin-bottom:16px;color:#1f2937;font-size:16px;font-weight:600;">Add New Provider</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Computing ID <span style="color:#ef4444">*</span></label>
          <input type="text" id="newFacultyId" placeholder="jsmith" required>
          <small>Lowercase, used for login</small>
        </div>
        <div class="form-group">
          <label>Full Name <span style="color:#ef4444">*</span></label>
          <input type="text" id="newFacultyName" placeholder="Jane Smith" required>
        </div>
        <div class="form-group">
          <label>Email Address <span style="color:#ef4444">*</span></label>
          <input type="email" id="newFacultyEmail" placeholder="jsmith@example.edu" required>
        </div>
      </div>
      <!-- Dynamic extra_config fields injected here by JS -->
      <div id="newFacultyExtraFields"></div>
      <div style="display:flex;gap:12px;margin-top:16px;">
        <button class="btn-primary" onclick="addFaculty()">Add Provider</button>
        <button class="btn-secondary" onclick="toggleAddForm()">Cancel</button>
      </div>
    </div>

    <!-- Faculty Table -->
    <div class="table-container" style="overflow-x:auto;">
      <table class="data-table" id="facultyTable">
        <thead id="facultyTableHead">
          <tr>
            <th style="width:100px;">ID</th>
            <th>Name</th>
            <th>Email</th>
            <!-- Dynamic attribute & service columns injected by JS -->
            <th style="width:80px;">Status</th>
            <th style="width:200px;">Actions</th>
          </tr>
        </thead>
        <tbody id="facultyTableBody">
          <tr><td colspan="5" class="loading">Loading providers...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Edit Faculty Modal -->
<div id="editFacultyModal" class="modal">
  <div class="modal-content" style="max-width:640px;">
    <div class="modal-header">
      <h3 class="modal-title">Edit Provider</h3>
      <span class="close-btn" onclick="closeEditFacultyModal()">&times;</span>
    </div>
    <form id="editFacultyForm" onsubmit="submitEditFaculty(event)">
      <input type="hidden" id="editFacultyId">
      <div class="form-grid">
        <div class="form-group">
          <label>Name <span style="color:#ef4444">*</span></label>
          <input type="text" id="editFacultyName" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="editFacultyEmail">
        </div>
      </div>

      <!-- Dynamic extra_config fields injected here by JS -->
      <div id="editFacultyExtraFields"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;">
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="editFacultyAdmin" style="width:auto;">
            Admin privileges
          </label>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="editFacultyMoonlighter" style="width:auto;" onchange="toggleMoonlightingPriority()">
            Moonlighter
          </label>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="editFacultyDraftExempt" style="width:auto;">
            Draft exempt
          </label>
        </div>
      </div>

      <div class="form-group" id="moonlightingPriorityGroup" style="display:none;">
        <label>Moonlighting Priority</label>
        <select id="editFacultyMoonlightingPriority">
          <option value="1">High — honored first</option>
          <option value="2" selected>Medium — standard</option>
          <option value="3">Low — filled after higher priority</option>
        </select>
      </div>

      <div style="display:flex;gap:12px;margin-top:24px;">
        <button type="submit" class="btn-primary">Save Changes</button>
        <button type="button" class="btn-secondary" onclick="closeEditFacultyModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<style>
.modal { display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center; }
.modal.show { display:flex; }
.modal-content { background:white;border-radius:12px;padding:24px;width:90%;max-height:90vh;overflow-y:auto; }
.modal-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #e5e7eb; }
.modal-title { font-size:20px;font-weight:700;margin:0; }
.close-btn { cursor:pointer;font-size:28px;color:#6b7280;line-height:1; }
.close-btn:hover { color:#1f2937; }
</style>
